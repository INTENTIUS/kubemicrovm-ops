stages:
  - check
  - deploy

check:
  stage: check
  image:
    name: node:22@sha256:0557ac14e0d45d02ed563067b82856ca5e7aa3437fa28d98d4350ea9c3d9494a
  timeout: '15 minutes'
  script:
    - npm ci
    - npx tsc --noEmit
    - npx chant lint .
    - npx vitest run

deploy:
  stage: deploy
  image:
    name: node:22@sha256:0557ac14e0d45d02ed563067b82856ca5e7aa3437fa28d98d4350ea9c3d9494a
  timeout: '150 minutes'
  when: manual
  allow_failure: true
  retry: 0
  environment:
    name: deploy
  variables:
    KMV_TIER: minimal
    KMV_CLUSTER_MODE: reference-existing
  script:
    - npm ci
    - test -n "${AWS_ACCESS_KEY_ID:-}${AWS_ROLE_ARN:-}" || { echo "no credentials wired — read the comments" >&2; exit 1; }
    - npx chant run all --components --env dev

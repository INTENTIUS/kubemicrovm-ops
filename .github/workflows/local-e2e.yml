name: local-e2e

# The claim on the tiers page is that the local recipes run per commit and cost
# nothing. This is what makes that true: k3d + floci + m80, the real operator,
# and the estate applied at two tiers, on a hosted runner with no AWS account.
#
# Every step runs the command the docs give a reader, through `just`, in the
# order the quick start gives them. It used to call the scripts directly —
# `bash scripts/local/local-up.sh minimal` — which is the same work by a route
# no reader takes, and that is exactly how two first-run bugs survived a green
# pipeline: a duplicate recipe that stopped `just` parsing the justfile at all
# (#31), and an m80 image predating a flag the harness passes (#23). Neither
# was reachable from here, because nothing here went through the front door.
#
# So: if a step in this job is not a command the docs tell someone to run, it
# is testing something nobody does.
#
# Two tiers rather than three: `minimal` and `prod-ha` between them cover every
# resource kind the kit declares, and applying `prod-ha` over a live `minimal`
# estate exercises a tier change — which is where the immutable-memory
# rejection was found. `prod` declares nothing `prod-ha` does not.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: local-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  AWS_ENDPOINT_URL: http://localhost:4566
  AWS_ACCESS_KEY_ID: test
  AWS_SECRET_ACCESS_KEY: test
  AWS_REGION: us-east-1
  # M80_IMAGE is deliberately not set. CI ran an override here for long enough
  # that the script's own default rotted underneath it unnoticed, which is how
  # a first run came to crashloop while this job stayed green. What an adopter
  # gets is what this job runs.

jobs:
  local-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The quick start's own lead-in: ./go installs whatever is missing and
      # stands the estate up. --yes because a runner cannot answer a prompt,
      # which is the only difference from what a reader runs.
      #
      # This is also the only thing that exercises the installers. A bootstrap
      # nobody runs on a machine missing something is a bootstrap that works
      # until the first person needs it; the runner has k3d and just missing,
      # so both paths run here every time.
      - name: ./go, the way the quick start says
        run: ./go --yes

      - name: just validate
        run: just validate minimal

      # Standing up twice is the assertion. local-up.sh used to open with
      # `k3d cluster delete`, so a second run — or a click on behold's Bring up
      # button, which calls this same script — destroyed a healthy estate and
      # rebuilt it. Reuse is only a claim until something re-runs it.
      - name: ./go again, reusing the cluster it already made
        run: |
          out="$(./go --yes 2>&1)" || { printf '%s\n' "$out"; exit 1; }
          printf '%s\n' "$out"
          printf '%s' "$out" | grep -q 'cluster .* already up, reusing it' || {
            echo "second run did not reuse the cluster" >&2; exit 1; }

      - name: and the estate still converges
        run: just validate minimal

      # Doctor is a diagnostic a reader runs when something is wrong, so the
      # risk is that it rots unnoticed — it is never exercised by a green run
      # unless a green run exercises it. Against a healthy stack every check
      # passes, which is the assertion.
      - name: just doctor
        run: just doctor

      # A tier change in place, which is the operation apply-estate.sh exists
      # for. The delete is not folded into the recipe: kubectl apply does not
      # prune, so the previous tier's VMs outlive the change, and a recipe that
      # quietly deleted every MicroVM would be a surprising thing to name
      # `apply-tier`. The quick start shows these same two commands.
      - name: just apply-tier prod-ha, over the live minimal estate
        run: |
          kubectl -n microvm-demo delete microvm --all --timeout=120s
          just apply-tier prod-ha

      - name: just validate prod-ha
        run: just validate prod-ha

      # Deliberately destructive, so it comes after everything that needs a
      # working estate. prod-ha is the tier declaring a connector, so one run
      # covers both the failed build and the failed connector.
      #
      # This was committed commented out until m80 v0.4.0 carried
      # -enable-injection (m80#74). It runs now.
      - name: just break-it prod-ha
        run: just break-it prod-ha

      # The cost check, and the last thing because it rebuilds the estate
      # against a 4096 MiB ceiling that prod-ha cannot fit in. That is the
      # point: a fresh AWS account is capped there, prod-ha asks for 8192, and
      # the refusal has to be legible rather than look like a hang. Everything
      # above this ran against the 262144 the harness normally raises it to.
      - name: just quota-refusal prod-ha
        run: just quota-refusal prod-ha

      - name: what the operator saw
        if: always()
        run: |
          kubectl -n kube-microvm logs deploy/kube-microvm-operator --tail=200 || true
          kubectl -n microvm-demo get microvmimages,microvms,microvmreplicasets,microvmclasses,microvmnetworks -o wide || true

      # Doctor again on the way out, because a stack that has been through a
      # tier change is a different stack from the one it agreed about earlier.
      - name: just doctor, after the tier change
        if: always()
        run: just doctor || true

      - name: just local-down
        if: always()
        run: just local-down
